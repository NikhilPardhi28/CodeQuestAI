name: baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.13.0
          enable-cache: true
      - name: Check dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate documentation links
        run: uv run python Tools/validate_docs.py
      - name: Validate configuration examples
        run: uv run python Tools/validate_config.py
      - name: Check generated OpenAPI contract
        run: uv run python Tools/export_openapi.py --check
      - name: Check Python lint
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Run backend and evaluator contract tests
        run: uv run python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: codequest_test
          POSTGRES_USER: codequest
          POSTGRES_PASSWORD: codequest-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codequest -d codequest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CODEQUEST_TEST_DATABASE_URL: postgresql+psycopg://codequest:codequest-test-only@127.0.0.1:5432/codequest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.13.0
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify PostgreSQL migrations and quest concurrency
        run: >-
          uv run python -m pytest -q
          BackendAPI/tests/test_migrations.py::test_postgres_migration_round_trip_when_configured
          BackendAPI/tests/test_quest_postgres_concurrency.py
          BackendAPI/tests/test_submission_postgres_concurrency.py
