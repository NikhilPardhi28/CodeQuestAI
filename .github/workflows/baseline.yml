name: baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.13.0
          enable-cache: true
      - name: Check dependency lock
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate documentation links
        run: uv run python Tools/validate_docs.py
      - name: Validate configuration examples
        run: uv run python Tools/validate_config.py
      - name: Check generated OpenAPI contract
        run: uv run python Tools/export_openapi.py --check
      - name: Check Python lint
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Run available backend tests
        run: uv run python -m pytest
